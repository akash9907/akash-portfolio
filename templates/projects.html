{% extends "base.html" %}
{% block title %}Projects - Akash{% endblock %}
{% block content %}
<h1>My Projects</h1>
<div class="grid">
    {% for p in projects %}
    <div class="card">
        <h3>{{ p.title }}</h3>
        <p>{{ p.desc }}</p>
        <div class="tags">
            {% for t in p.tech %}<span class="tag">{{ t }}</span>{% endfor %}
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
